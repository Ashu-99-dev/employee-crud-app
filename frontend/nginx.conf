# Nginx Configuration for Employee CRUD Frontend
# Serves static files and proxies API requests to the backend container.

server {
    listen 80;
    server_name localhost;

    # Serve static files from the web root
    root /usr/share/nginx/html;
    index index.html;

    # Serve the main page for all non-API, non-file routes (SPA-style fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend container.
    # When the frontend JavaScript calls /api/employees, Nginx forwards
    # the request to the backend service on port 3000.
    # This avoids CORS issues in production since the browser sees
    # both the frontend and API on the same origin.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy the health check endpoint too
    location /health {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Gzip compression for faster loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
