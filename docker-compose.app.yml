# =============================================================================
# Docker Compose — APPLICATION INSTANCE (Frontend + Backend)
# =============================================================================
# Deploy this on your app server/instance.
# The backend connects to the database on a REMOTE instance via DB_HOST.
#
# REQUIRED: Set DB_HOST to the IP or hostname of your database instance.
#
# Usage:
#   DB_HOST=<db-server-ip> docker compose -f docker-compose.app.yml up -d
#
# Or create a .env file with:
#   DB_HOST=192.168.1.100
#
# Then:
#   docker compose -f docker-compose.app.yml up -d
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # BACKEND — Node.js + Express
  # ---------------------------------------------------------------------------
  # Connects to the remote PostgreSQL instance using DB_HOST env var.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: employee-api
    environment:
      PORT: 3000
      # DB_HOST points to the REMOTE database instance IP/hostname.
      # This is NOT "database" (the Docker service name) anymore,
      # because PostgreSQL is running on a different machine.
      DB_HOST: ${DB_HOST:?ERROR - Set DB_HOST to your database server IP}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-employee_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "3000:3000"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http=require('http');http.get('http://localhost:3000/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # FRONTEND — Nginx
  # ---------------------------------------------------------------------------
  # Serves static files and proxies /api/* to the backend container.
  # Frontend and backend are on the SAME instance, so Nginx can still
  # reach the backend using the Docker service name "backend".
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: employee-frontend
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

# Frontend and backend share this network so Nginx can proxy to backend:3000
networks:
  app-network:
    driver: bridge
